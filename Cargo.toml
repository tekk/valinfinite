[package]
name = "wasm-infinite-gpu-fractal"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "Infinite real-time heart-shaped GPU fractal zoom in WebAssembly and WebGL2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "WebGlBuffer",
  "Performance",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
